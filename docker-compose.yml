services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: asset-rise-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SUPABASE_URL=http://supabase-kong:8000
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_DB_URL=postgresql://postgres:${POSTGRES_PASSWORD}@supabase-db:5432/postgres
      - ALLOWED_ORIGINS=https://asset-rise-admin.byclick.co.il
      - PUBLIC_APP_URL=https://asset-rise-admin.byclick.co.il
    networks:
      - asset-rise
      - coolify
      - supabase_default

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: asset-rise-web
    restart: unless-stopped
    depends_on:
      - api
    labels:
      - traefik.enable=true
      - traefik.http.routers.asset-rise-admin.rule=Host(`asset-rise-admin.byclick.co.il`)
      - traefik.http.routers.asset-rise-admin.entrypoints=https
      - traefik.http.routers.asset-rise-admin.tls=true
      - traefik.http.routers.asset-rise-admin.tls.certresolver=letsencrypt
      - traefik.http.services.asset-rise-admin.loadbalancer.server.port=80
      - traefik.docker.network=coolify
    networks:
      - asset-rise
      - coolify

networks:
  asset-rise:
    driver: bridge
  coolify:
    external: true
    name: coolify
  supabase_default:
    external: true
    name: supabase_default
